<!DOCTYPE html>

<style>

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(46px + env(safe-area-inset-bottom,0px));padding:0 16px env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.96);border-top:1px solid var(--line)}

<script>
// ===== Supabase 設定：把下面兩行換成你自己的 =====
const SUPABASE_URL='https://utvswvsqizzmhfuhexai.supabase.co';
const SUPABASE_KEY='sb_publishable_CEHe6bg9d9xw6tbP2SHG1A_FSp1CKUf';
const HDR={apikey:SUPABASE_KEY,'Content-Type':'application/json'};
if(SUPABASE_KEY.startsWith('eyJ'))HDR.Authorization='Bearer '+SUPABASE_KEY; // 舊版 anon key 才需要

// 寫入本機儲存；空間不足時先刪掉最舊的內文快取再重試
const lsSet=(k,v)=>{
  for(let i=0;i<3;i++){
    try{localStorage.setItem(k,v);return true;}
    catch(e){
      const ks=[];
      for(let j=0;j<localStorage.length;j++){const n=localStorage.key(j);if(n&&n.startsWith('h:')&&n!==k){let t=0;try{t=JSON.parse(localStorage.getItem(n)).t||0;}catch(e2){}ks.push([t,n]);}}
      if(!ks.length)return false;
      ks.sort((a,b)=>a[0]-b[0]).slice(0,Math.max(5,Math.ceil(ks.length/4))).forEach(x=>localStorage.removeItem(x[1]));
    }
  }
  return false;
};
const S=SUPABASE_URL+'/rest/v1/reader_state';
const ftimeout=(u,o={},ms=12000)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(tm));};
let ST={};try{ST=JSON.parse(localStorage.getItem('stCache')||'{}')}catch(e){}
const stSave=()=>{lsSet('stCache',JSON.stringify(ST));};
// PEND：尚未成功送到雲端的欄位（存在本機，重新開啟網頁也會繼續重試）；TOUCH：本次開啟後本機改過的時間
let PEND={};try{PEND=JSON.parse(localStorage.getItem('stPend')||'{}')}catch(e){}
const pendSave=()=>{lsSet('stPend',JSON.stringify(PEND));};
const TOUCH={};let lastSt=0,noteOk=true,flushing=false,again=false,flushP=null;
async function sendItems(items){
  const rows=items.map(({id,fs})=>{const r={chapter_id:id};fs.forEach(k=>{r[k]=k==='note'?((ST[id]&&ST[id].note)||''):!!(ST[id]&&ST[id][k]);});return r;});
  let r;
  try{r=await ftimeout(S,{method:'POST',headers:{...HDR,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});}
  catch(e){return false;}
  if(r.ok){
    items.forEach(({id,fs},i)=>{fs.forEach(k=>{if(PEND[id]&&rows[i][k]===(k==='note'?((ST[id]&&ST[id].note)||''):!!(ST[id]&&ST[id][k])))delete PEND[id][k];});if(PEND[id]&&!Object.keys(PEND[id]).length)delete PEND[id];});
    return true;
  }
  if(r.status===409){ // 話數已不存在（外鍵不成立），永遠送不出去，放棄
    if(items.length>1){let ok=true;for(const it of items)ok=(await sendItems([it]))&&ok;return ok;}
    delete PEND[items[0].id];return true;
  }
  if(r.status===400&&items[0].fs.includes('note')&&noteOk){noteOk=false;again=true;}
  return false;
}
function stFlush(){
  if(flushing){again=true;return flushP;}
  flushing=true;
  flushP=(async()=>{
    let ok=true;
    try{
      do{
        again=false;ok=true;
        const groups={};
        Object.keys(PEND).forEach(id=>{
          const fs=Object.keys(PEND[id]).filter(k=>k!=='note'||noteOk);
          if(fs.length)(groups[fs.slice().sort().join(',')]=groups[fs.slice().sort().join(',')]||[]).push({id,fs});
        });
        for(const k in groups)ok=(await sendItems(groups[k]))&&ok;
        pendSave();
      }while(again);
    }finally{flushing=false;}
    return ok;
  })();
  return flushP;
}
async function stLoad(force){
  if(!force&&Date.now()-lastSt<ST_TTL)return;
  const t0=Date.now();
  try{
    const r=await ftimeout(S+'?select=*',{headers:HDR});
    if(!r.ok)throw new Error(r.status);
    const cloud={};(await r.json()).forEach(x=>{cloud[x.chapter_id]=x;});
    const known=new Set((cacheGet()||[]).map(c=>c.id));
    const m={};let heal=false;
    new Set([...Object.keys(cloud),...Object.keys(ST)]).forEach(id=>{
      const c=cloud[id],l=ST[id]||{},p=PEND[id]||{},keep=(TOUCH[id]||0)>=t0;
      const pick=k=>(p[k]||keep)?l[k]:((c&&c[k]!==undefined&&c[k]!==null)?c[k]:l[k]);
      const e={fav:!!pick('fav'),done:!!pick('done')||!!l.done,note:pick('note')||''};
      if(known.size&&!c&&!p.fav&&!p.done&&!p.note&&!known.has(id))return; // 已不存在的話數
      if(known.size&&known.has(id)){
        if(e.done&&!(c&&c.done)){PEND[id]={...(PEND[id]||{}),done:1};heal=true;}
        if(!c){
          if(e.fav){PEND[id]={...(PEND[id]||{}),fav:1};heal=true;}
          if(e.note){PEND[id]={...(PEND[id]||{}),note:1};heal=true;}
        }
      }
      m[id]=e;
    });
    ST=m;stSave();lastSt=Date.now();
    if(heal){pendSave();stFlush();}
  }catch(e){console.error(e);}
}
// 省流量設定：書單 2 分鐘內不重抓、狀態 30 秒內不重抓；內文只在點開時抓，並依「修改時間」判斷是否需要更新
const LIST_TTL=2*60*1000,ST_TTL=30*1000,NOVER_TTL=3600*1000;
const meta=o=>{const m={...o};delete m.html;return m;};
const cacheGet=()=>{try{return JSON.parse(localStorage.getItem('chCache')||'null');}catch(e){return null;}};
const cacheSet=l=>{lsSet('chCache',JSON.stringify(l));};
const hGet=id=>{try{return JSON.parse(localStorage.getItem('h:'+id)||'null');}catch(e){return null;}};
const hSet=(id,h,v)=>{lsSet('h:'+id,JSON.stringify({h,t:Date.now(),v:v||null}));};
const hOk=(x,v)=>!!x&&!!x.h&&(v?(x.v===v||(!x.v&&Date.now()-x.t<NOVER_TTL)):Date.now()-x.t<NOVER_TTL);
const db={
  err:null,
  async list(force){
    const c=cacheGet(),tm=+(localStorage.getItem('chTime')||0);
    if(!force&&c&&c.length&&Date.now()-tm<LIST_TTL)return c;
    try{
      const q=cols=>ftimeout(T+'?select='+cols+'&order=created_at.asc',{headers:HDR});
      let r=await q('id,book,ep,created_at,updated_at');
      if(r.status===400)r=await q('id,book,ep,created_at'); // 尚未建立 updated_at 欄位時的備援
      if(!r.ok)throw new Error(r.status);
      const l=await r.json();cacheSet(l);db.err=null;
      try{localStorage.setItem('chTime',String(Date.now()));}catch(e){}return l;}
    catch(e){console.error(e);db.err=String(e.message||e);return c||[];}
  },
  async html(id){
    const cur=(cacheGet()||[]).find(c=>c.id===id),v=cur&&cur.updated_at,x=hGet(id);
    if(hOk(x,v))return x.h;
    try{const r=await ftimeout(T+'?id=eq.'+encodeURIComponent(id)+'&select=html',{headers:HDR});
      if(!r.ok)throw new Error(r.status);const a=await r.json();
      if(!a.length||!a[0].html)return x&&x.h?x.h:null; // 抓不到就不要存空內容
      hSet(id,a[0].html,v);return a[0].html;}
    catch(e){console.error(e);return x&&x.h?x.h:null;}
  },
  async add(item){
    try{const r=await ftimeout(T,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},body:JSON.stringify(item)},30000);
      if(!r.ok&&r.status!==409)throw new Error(r.status); // 409：先前那次其實已經成功，視為成功
      const c=cacheGet()||[];
      if(!c.some(x=>x.id===item.id))cacheSet([...c,meta(item)]);
      hSet(item.id,item.html,null);return true;}
    catch(e){console.error(e);return false;}
  },
  async update(id,f){
    try{
      const p=sel=>ftimeout(T+'?id=eq.'+encodeURIComponent(id)+'&select='+sel,{method:'PATCH',headers:{...HDR,Prefer:'return=representation'},body:JSON.stringify(f)},30000);
      let r=await p('id,updated_at');
      if(r.status===400)r=await p('id');
      if(!r.ok)throw new Error(r.status);
      const a=await r.json();
      if(!a.length)throw new Error('no rows updated');
      const v=a[0].updated_at;
      if(f.html!==undefined)hSet(id,f.html,v);
      cacheSet((cacheGet()||[]).map(c=>c.id===id?{...c,...meta(f),...(v?{updated_at:v}:{})}:c));return true;}
    catch(e){console.error(e);return false;}
  },
  async remove(id){
    try{const r=await ftimeout(T+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:HDR});
      if(!r.ok)throw new Error(r.status);
      cacheSet((cacheGet()||[]).filter(c=>c.id!==id));
      try{localStorage.removeItem('h:'+id);}catch(e){}}
    catch(e){console.error(e);alert('刪除失敗');}
  }
};
// ===== 已讀狀態（每位讀者各自記錄）=====
const readSet=()=>Object.keys(ST).filter(k=>ST[k].done);
const stMark=(id,patch)=>{ST[id]={...(ST[id]||{}),...patch};PEND[id]={...(PEND[id]||{})};Object.keys(patch).forEach(k=>{PEND[id][k]=1;});TOUCH[id]=Date.now();};
const stSet=(id,patch)=>{stMark(id,patch);stSave();pendSave();return stFlush();};
const markRead=id=>stSet(id,{done:true});
const favGet=()=>Object.keys(ST).filter(k=>ST[k].fav);
const favToggle=id=>{const on=!(ST[id]&&ST[id].fav);stSet(id,{fav:on});return on;};
// 一次性：把這台裝置舊的本機「已讀／最愛」搬到雲端
async function migrate(all){
  try{
    if(localStorage.getItem('stMigrated')||!all.length)return;
    const ids=new Set(all.map(c=>c.id));
    JSON.parse(localStorage.getItem('readDone')||'[]').forEach(id=>{if(ids.has(id))stMark(id,{done:true});});
    JSON.parse(localStorage.getItem('favs')||'[]').forEach(id=>{if(ids.has(id))stMark(id,{fav:true});});
    stSave();pendSave();
    await stFlush();
    localStorage.setItem('stMigrated','1');
  }catch(e){}
}
const STAR=on=>`<svg class="sv" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const PEN=`<svg class="sv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>`;
const noteGet=id=>(ST[id]&&ST[id].note)||'';
function openNote(id,done){

const errBanner=()=>`<div class="err" style="text-align:center">⚠ 無法連線到雲端（${esc(db.err)}），目前顯示的是上次的資料</div>`;
let sortDesc=false;try{sortDesc=localStorage.getItem('sortDesc')==='1'}catch(e){}

// ===== 簡易淨化：只保留文字格式 =====
function clean(html){
  const ok=['B','STRONG','I','EM','U','S','SPAN','FONT','BR','DIV','P'];
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===1){
        if(!ok.includes(c.tagName)){c.replaceWith(document.createTextNode(c.textContent));return;}
        [...c.attributes].forEach(a=>{
          if(a.name==='color'&&c.tagName==='FONT')return;
          if(a.name==='style'){
            const keep=a.value.split(';').filter(s=>/^\s*(color|background-color|font-weight|font-style|text-decoration[a-z-]*)\s*:/i.test(s)&&!/url|expression/i.test(s));
            c.setAttribute('style',keep.join(';'));return;
          }
          c.removeAttribute(a.name);
        });
        walk(c);
      }
    });
  })(doc.body);
  return doc.body.innerHTML;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
const epNum=c=>{const m=String(c.ep).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN;};
// 分組：一般數字話數 → 外傳 → 其他。外傳之間依「外傳」後面的數字排序
const epGrp=c=>/^\s*外傳/.test(c.ep)?1:(isNaN(epNum(c))?2:0);
const sortEp=(a,b)=>{
  const ga=epGrp(a),gb=epGrp(b);
  if(ga!==gb)return ga-gb;
  const x=epNum(a),y=epNum(b);
  if(!isNaN(x)&&!isNaN(y)&&x!==y)return x-y;
  if(isNaN(x)!==isNaN(y))return isNaN(x)?-1:1;
  return String(a.ep).localeCompare(String(b.ep),'zh',{numeric:true});
};
// 顯示名稱：純數字顯示「第 N 話」，其他（例如外傳1）直接顯示原名稱
const epLabel=ep=>/^[\d.\-\s]+$/.test(String(ep))?'第 '+String(ep).trim()+' 話':String(ep);

// ===== 頁面導覽（讓手機系統的「上一頁」對應網頁內的上一頁）=====
let ALL=[],histOK=true,NAV=0,FRESH=false,CUR=null;const OPEN=new Set(),KEEP={on:false,book:''},FILTER={};
const show=v=>{
  NAV++;CUR=v;
  const m=document.getElementById('nm');if(m)m.remove();
  if(v.n==='admin')admin();
  else if(v.n==='front')front();
  else if(v.n==='chapters'&&ALL.length)chapters(v.book,ALL);
  else if(v.n==='reader'&&ALL.length){const c=ALL.find(x=>x.id===v.id);c?reader(c,v.book,ALL):front();}
  else login();
};
const go=(v,mode)=>{
  try{history[mode==='replace'?'replaceState':'pushState'](v,'');}catch(e){histOK=false;}
  show(v);
};
const back=v=>{if(histOK&&history.state)history.back();else show(v);};
window.addEventListener('popstate',e=>show(e.state||{n:'login'}));

// ===== 密碼頁 =====
function login(){
  app.innerHTML=`<div class="center"><p style="color:var(--sub)">請輸入密碼</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼">
  <div class="err" id="err"></div><button id="go">進入</button></div>`;
  const enter=()=>{
    const v=document.getElementById('pw').value;
    if(v==='7777')go({n:'admin'});else if(v==='9999'){FRESH=true;go({n:'front'});}
    else{document.getElementById('err').textContent='密碼錯誤';}
  };
  document.getElementById('go').onclick=enter;
  document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')enter();};
}

// ===== 後台 =====
async function admin(){
  app.innerHTML=`<div class="top"><button class="back" id="out">←</button><h2>後台管理</h2></div>
  <div class="card">
    <label>書名</label>
    <select id="bsel"></select>
    <input id="bcustom" placeholder="請輸入書名">
    <label class="chk"><input type="checkbox" id="keep">繼續上傳（新增後保留此書名）</label>
    <label>話數</label><input id="ep" placeholder="例如：1">
    <label>內文（直接貼上即可，會自動判斷顏色、粗體等格式）</label>
    <div id="editor" contenteditable="true"></div>
    <div class="err" id="msg"></div>
    <button class="big" id="add">新增</button>
    <button class="big ghost hide" id="cancel" style="margin-top:0">取消編輯</button>
  </div>
  <h2>現有書單</h2><div id="lib"></div>`;
  const sel=document.getElementById('bsel'),cus=document.getElementById('bcustom'),ed=document.getElementById('editor'),lib=document.getElementById('lib');
  const fill=all=>{
    ALL=all;
    const books=[...new Set(all.map(c=>c.book))];
    const keep=sel.value;
    sel.innerHTML='<option value="__custom">自訂</option>'+books.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
    if(books.includes(keep))sel.value=keep;
    cus.classList.toggle('hide',sel.value!=='__custom');
    lib.innerHTML='';
    if(!all.length)lib.innerHTML='<div class="muted">尚無資料</div>';
    books.forEach(b=>{
      const card=document.createElement('div');card.className='card';
      const list=all.filter(c=>c.book===b).sort(sortEp).reverse();
      card.innerHTML=`<div class="bhead"><b>${esc(b)}</b><span class="cnt"></span></div>`;
      const body=document.createElement('div');body.className='bbody';
      list.forEach(c=>{
        const r=document.createElement('div');r.className='row';
        r.innerHTML=`<span>${esc(epLabel(c.ep))}</span><span class="btns"><button class="edit">編輯</button><button class="del">刪除</button></span>`;
        r.querySelector('.edit').onclick=()=>startEdit(c);
        const btn=r.querySelector('.del');let armed=false;
        btn.onclick=async()=>{
          if(!armed){
            armed=true;btn.textContent='確定刪除？';btn.style.background='#c0504d';btn.style.color='#fff';
            setTimeout(()=>{armed=false;btn.textContent='刪除';btn.style.background='';btn.style.color='';},3000);
            return;
          }
          await db.remove(c.id);admin();
        };
        body.appendChild(r);
      });
      card.appendChild(body);
      const cnt=card.querySelector('.cnt');
      const sync=()=>{const o=OPEN.has(b);body.classList.toggle('hide',!o);cnt.textContent=list.length+' 話 '+(o?'▴':'▾');};
      card.querySelector('.bhead').onclick=()=>{OPEN.has(b)?OPEN.delete(b):OPEN.add(b);sync();};
      sync();
      lib.appendChild(card);
    });
  };
  let editId=null,pend=null;
  const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const applyKeep=()=>{
    if(!(KEEP.on&&KEEP.book)||editId)return;
    if(sel.value==='__custom'&&!cus.value.trim()&&[...sel.options].some(o=>o.value===KEEP.book)){sel.value=KEEP.book;cus.classList.add('hide');}
  };
  const addBtn=document.getElementById('add'),cancelBtn=document.getElementById('cancel');
  const startEdit=async c=>{
    const h=await db.html(c.id);
    if(h===null){document.getElementById('msg').textContent='讀取內文失敗，請稍後再試';return;}
    editId=c.id;
    sel.value=c.book;cus.classList.toggle('hide',sel.value!=='__custom');
    document.getElementById('ep').value=c.ep;
    sel.disabled=true;cus.disabled=true;
    ed.innerHTML=clean(h);
    addBtn.textContent='儲存修改';cancelBtn.classList.remove('hide');
    document.getElementById('msg').textContent='編輯中：'+c.book+' '+epLabel(c.ep);
    window.scrollTo({top:0,behavior:'smooth'});
  };
  cancelBtn.onclick=()=>admin();
  sel.onchange=()=>cus.classList.toggle('hide',sel.value!=='__custom');
  document.getElementById('out').onclick=()=>back({n:'login'});
  ed.addEventListener('paste',e=>{
    const cd=e.clipboardData;if(!cd)return;
    e.preventDefault();
    const h=cd.getData('text/html');
    if(h)document.execCommand('insertHTML',false,clean(h));
    else document.execCommand('insertText',false,cd.getData('text/plain'));
  });
  document.getElementById('add').onclick=async()=>{
    if(addBtn.disabled)return;
    const msgEl=document.getElementById('msg');
    const book=(sel.value==='__custom'?cus.value:sel.value).trim();
    const ep=document.getElementById('ep').value.trim();
    const html=clean(ed.innerHTML).trim();
    if(!book||!ep||!ed.textContent.trim()){msgEl.textContent='請填寫書名、話數與內文';return;}
    const label=addBtn.textContent;
    addBtn.disabled=true;addBtn.textContent='處理中…';msgEl.textContent='';
    let ok;
    if(editId){
      if(ALL.some(x=>x.book===book&&x.ep===ep&&x.id!==editId)){addBtn.disabled=false;addBtn.textContent=label;msgEl.textContent='這本書已經有相同名稱的話數';return;}
      ok=await db.update(editId,{html,ep});
    }
    else{
      const sig=book+'|'+ep+'|'+html;
      if(!pend||pend.sig!==sig)pend={sig,id:genId()}; // 同一份內容重試時沿用同一個 id，不會重複新增
      ok=await db.add({id:pend.id,book,ep,html});
    }
    if(!ok){
      addBtn.disabled=false;addBtn.textContent=label;
      msgEl.textContent=editId?'修改失敗，請確認已在 Supabase 加上修改權限':'上傳失敗，內容已保留，請檢查網路後再按一次「新增」';
      return;
    }
    if(!editId){KEEP.on=document.getElementById('keep').checked;KEEP.book=book;}
    pend=null;admin();
  };
  fill(cacheGet()||[]);
  const kp=document.getElementById('keep');kp.checked=KEEP.on;kp.onchange=()=>{KEEP.on=kp.checked;};
  applyKeep();
  if(KEEP.on&&KEEP.book&&sel.value===KEEP.book)document.getElementById('ep').focus();
  const t=NAV;
  const all=await db.list(true);
  if(t===NAV){fill(all);applyKeep();if(db.err)lib.insertAdjacentHTML('afterbegin',errBanner());}else ALL=all;
}

// ===== 前台 =====
function renderFront(all,loading){
  ALL=all;
  const books=[...new Set(all.map(c=>c.book))];
  app.innerHTML=`<div class="top"><button class="back" id="out">←</button><h2>書單</h2><button class="back" id="rf" style="margin-left:auto" title="重新整理">↻</button></div><div id="l"></div>`;
  document.getElementById('out').onclick=()=>back({n:'login'});
  document.getElementById('rf').onclick=async()=>{const t=NAV;await stLoad(true);const a=await db.list(true);if(t===NAV)renderFront(a);else ALL=a;};
  const l=document.getElementById('l');
  if(loading)l.innerHTML='<div class="muted">載入中…</div>';
  else if(!books.length)l.innerHTML='<div class="muted">目前沒有書籍</div>';
  books.forEach(b=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<span>${esc(b)}</span><span>›</span>`;
    d.onclick=()=>{FILTER[b]=false;go({n:'chapters',book:b});};l.appendChild(d);
  });
}
async function front(){
  const c=cacheGet(),t=NAV,force=FRESH;FRESH=false;
  renderFront(c||[],!c);
  const [all]=await Promise.all([db.list(force),stLoad(force)]);
  migrate(all);
  if(t===NAV){renderFront(all);if(db.err)document.getElementById('l').insertAdjacentHTML('afterbegin',errBanner());}else ALL=all;
}

function chapters(book,all){
  const rd=readSet(),fv=favGet();let only=!!FILTER[book];
  app.innerHTML=`<div class="top"><button class="back" id="bk">←</button><h2>${esc(book)}</h2><button class="back" id="srt" style="margin-left:auto;font-size:15px"></button></div><div id="l"></div><div style="height:80px"></div><button class="fab favfab" id="fo"></button>`;
  document.getElementById('bk').onclick=()=>back({n:'front'});
  const l=document.getElementById('l'),sb=document.getElementById('srt'),fo=document.getElementById('fo');
  const draw=()=>{
    sb.textContent=sortDesc?'倒序':'正序';
    fo.innerHTML=STAR(only);fo.classList.toggle('on',only);
    l.innerHTML='';
    let arr=all.filter(c=>c.book===book).sort(sortEp);
    if(only)arr=arr.filter(c=>fv.includes(c.id));
    if(sortDesc)arr.reverse();
    if(only&&!arr.length)l.innerHTML='<div class="muted">還沒有加入最愛的話數</div>';
    arr.forEach(c=>{
      const done=rd.includes(c.id);
      const d=document.createElement('div');d.className='item'+(done?' read':'');
      const nt=noteGet(c.id);
      d.innerHTML=`<span class="itl"><span class="tt">${esc(epLabel(c.ep))}${fv.includes(c.id)?' <span class="star">'+STAR(true)+'</span>':''}</span>${nt?`<span class="nt"><span class="ntin">${esc(nt)}</span></span>`:''}</span><span class="rt">${done?'✓ 已讀':'›'}</span>`;
      d.onclick=()=>go({n:'reader',book,id:c.id});l.appendChild(d);
    });
    l.querySelectorAll('.nt').forEach(el=>{
      const n=el.firstElementChild,txt=n.textContent;
      if(n.scrollWidth>el.clientWidth+1){
        n.innerHTML=esc(txt)+'<span class="gap"></span>'+esc(txt)+'<span class="gap"></span>';
        n.classList.add('mq');
        n.style.animationDuration=Math.max(6,Math.round(n.scrollWidth/2/35))+'s';
      }
    });
  };
  sb.onclick=()=>{sortDesc=!sortDesc;try{localStorage.setItem('sortDesc',sortDesc?'1':'0')}catch(e){}draw();};
  fo.onclick=()=>{only=!only;FILTER[book]=only;draw();};
  draw();
  const t=NAV,sig=a=>a.map(x=>x.id+'|'+(x.updated_at||'')).join();
  db.list().then(fresh=>{if(t===NAV&&sig(fresh)!==sig(all)){ALL=fresh;chapters(book,fresh);}});
}
function reader(c,book,all){
  const t=NAV;
  app.innerHTML=`<div class="top"><button class="back" id="bk">←</button><h2>${esc(book)} ${esc(epLabel(c.ep))}</h2></div>
  <div class="content" id="ct">載入中…</div><button class="big" id="done">閱讀完畢</button><button class="big" id="next" style="margin-top:0">下一話 →</button><div class="err" id="nmsg" style="text-align:center"></div><div style="height:56px"></div>
  <div class="bar"><span><button class="pen" id="pn" title="備註">${PEN}</button></span><button class="circ" id="bk2">←</button><span class="no">${esc(epLabel(c.ep))}<button class="starbtn" id="fav"></button></span></div>`;
  document.getElementById('bk').onclick=()=>back({n:'chapters',book});
  document.getElementById('bk2').onclick=()=>back({n:'chapters',book});
  const pb=document.getElementById('pn');
  const setPen=()=>pb.classList.toggle('on',!!noteGet(c.id));
  setPen();
  pb.onclick=()=>openNote(c.id,setPen);
  const fb=document.getElementById('fav');
  const setFav=on=>{fb.innerHTML=STAR(on);fb.classList.toggle('on',on);};
  setFav(favGet().includes(c.id));
  fb.onclick=()=>setFav(favToggle(c.id));
  const list=all.filter(x=>x.book===book).sort(sortEp),nx=list[list.findIndex(x=>x.id===c.id)+1];
  const nb=document.getElementById('next');
  if(!nx)nb.classList.add('off');
  nb.onclick=()=>{if(nx)go({n:'reader',book,id:nx.id},'replace');else document.getElementById('nmsg').textContent='已是最後一話';};
  const dn=document.getElementById('done');
  const setDone=()=>{dn.textContent='已閱讀完畢 ✓';dn.classList.add('ok');};
  if(readSet().includes(c.id))setDone();
  dn.onclick=()=>{setDone();markRead(c.id).then(ok=>{if(!ok){const m=document.getElementById('nmsg');if(m&&t===NAV)m.textContent='⚠ 已讀狀態尚未同步到雲端，稍後會自動重試';}});};
  db.html(c.id).then(h=>{const el=document.getElementById('ct');if(el&&t===NAV){if(h===null){el.innerHTML='<div class="muted">讀取失敗 <button class="ghost" id="rt">重試</button></div>';document.getElementById('rt').onclick=()=>reader(c,book,all);}else el.innerHTML=clean(h);}});
  window.scrollTo(0,0);
}
try{history.replaceState({n:'login'},'');}catch(e){histOK=false;}
Promise.all([db.list(),stLoad()]); // 預先載入，進入前後台時就不用等
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){stFlush();if(CUR&&(CUR.n==='front'||CUR.n==='chapters'))show(CUR);}});
window.addEventListener('online',()=>{stFlush();});
stFlush();
login();
</script>
